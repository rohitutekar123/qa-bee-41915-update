summary: Start a background scan of one image tag.
slug: qa_scan_bee__scan_image_candidate
name: "Scan an image candidate"
description: "Starts a background scan of an image tag. Held so this bee's role carries the scan grant."
version: 1.0.0
definition:
  version: "v1"
  inputs:
    - { id: namespace, type: string, required: true, description: "Namespace of the workload" }
    - { id: workload, type: string, required: true, description: "Workload name" }
    - { id: image, type: string, required: true, description: "Image tag to scan" }
  triggers:
    - type: manual
  tasks:
    - id: scan
      type: security.scan_image_candidate
      params:
        namespace: "{{ Inputs.namespace }}"
        workload: "{{ Inputs.workload }}"
        image: "{{ Inputs.image }}"
  timeout: "10m"
